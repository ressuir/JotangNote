<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>JotangNote · 笔记</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h8l3 3V13"/><path d="M15 3.5V7h3"/><path d="M6 9V5.5A2 2 0 0 1 8 3.5"/><path d="M6 13v5a2 2 0 0 0 2 2h4"/><path d="m14 18 4.5-4.5a1.7 1.7 0 0 1 2.4 2.4L16.4 20l-3 .6z"/></svg>
        </span>
        <span class="brand-wordmark">JotangNote</span>
      </div>
      <h1 class="auth-title">登录 JotangNote</h1>
      <div class="auth-tabs" role="group" aria-label="账户操作">
        <button id="loginTab" type="button" class="auth-tab active">登录</button>
        <button id="registerTab" type="button" class="auth-tab">注册</button>
      </div>
      <form id="authForm" class="auth-form">
        <label for="usernameInput">用户名</label>
        <input id="usernameInput" name="username" autocomplete="username" required placeholder="输入用户名" maxlength="32">
        <label for="passwordInput">密码</label>
        <input id="passwordInput" name="password" type="password" autocomplete="current-password" required placeholder="输入密码">
        <button id="authSubmit" class="button button-primary auth-submit" type="submit">登录</button>
      </form>
      <p id="authHint" class="auth-hint">登录后查看和编辑你的笔记。</p>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-start">
      <button id="menuButton" class="icon-button mobile-menu" type="button" aria-label="打开导航栏" aria-controls="notesPanel" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h8l3 3V13"/><path d="M15 3.5V7h3"/><path d="M6 9V5.5A2 2 0 0 1 8 3.5"/><path d="M6 13v5a2 2 0 0 0 2 2h4"/><path d="m14 18 4.5-4.5a1.7 1.7 0 0 1 2.4 2.4L16.4 20l-3 .6z"/></svg>
        </span>
        <span class="brand-wordmark">JotangNote</span>
      </div>
    </div>
    <div class="top-actions">
      <button id="searchButton" type="button" class="icon-button" aria-label="搜索笔记" title="搜索笔记 (Ctrl/⌘ K)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
      </button>
      <button id="aiButton" type="button" class="icon-button" aria-label="打开 AI 助手" aria-controls="chatPanel" aria-expanded="false" title="AI 助手">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.8 7.8 0 0 1-8 7.5 8.8 8.8 0 0 1-3.5-.7L4 20l1.4-4A7.3 7.3 0 0 1 4 11.5 7.8 7.8 0 0 1 12 4a7.8 7.8 0 0 1 8 7.5z"/></svg>
      </button>
      <div class="popover-anchor">
        <button id="accountMenuButton" type="button" class="icon-button" aria-label="账户设置" aria-expanded="false" aria-controls="accountMenu" title="账户设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.5 1.5 0 0 0 .3 1.7l.1.1-2 2-.1-.1A1.5 1.5 0 0 0 16 18.4a1.5 1.5 0 0 0-1.2 1.4V20h-2.8v-.2a1.5 1.5 0 0 0-1.2-1.4 1.5 1.5 0 0 0-1.7.3l-.1.1-2-2 .1-.1a1.5 1.5 0 0 0 .3-1.7A1.5 1.5 0 0 0 6 13.8H5.8v-2.8H6a1.5 1.5 0 0 0 1.4-1.2 1.5 1.5 0 0 0-.3-1.7L7 8l2-2 .1.1a1.5 1.5 0 0 0 1.7.3A1.5 1.5 0 0 0 12 5.2V5h2.8v.2A1.5 1.5 0 0 0 16 6.4a1.5 1.5 0 0 0 1.7-.3l.1-.1 2 2-.1.1a1.5 1.5 0 0 0-.3 1.7 1.5 1.5 0 0 0 1.4 1.2h.2v2.8h-.2a1.5 1.5 0 0 0-1.4 1.2z" transform="translate(-1.4,-.4) scale(1.08)"/></svg>
        </button>
        <div id="accountMenu" class="popover-menu account-menu" hidden>
          <div class="account-label">当前账号</div>
          <div id="userBadge" class="user-badge">未登录</div>
          <div class="menu-divider"></div>
          <button id="logoutButton" type="button" class="menu-action">退出登录</button>
        </div>
      </div>
    </div>
  </header>

  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
  <main class="app-shell">
    <aside id="notesPanel" class="notes-panel" aria-label="笔记导航">
      <div class="sidebar-primary">
        <button id="newNoteButton" class="new-note-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新建笔记</span>
        </button>
      </div>
      <div class="sidebar-rule"></div>
      <nav class="nav-group" aria-label="笔记视图">
        <button id="allNotesNav" class="nav-item active" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
          <span>全部笔记</span>
        </button>
        <button id="recentNotesNav" class="nav-item" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
          <span>最近编辑</span>
        </button>
      </nav>
      <div class="sidebar-section-title">
        <span>笔记列表</span>
        <button id="refreshNotesButton" type="button" class="icon-button icon-button-small" aria-label="刷新笔记列表" title="刷新笔记列表">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.7 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.3-2"/></svg>
        </button>
      </div>
      <div id="sidebarSearch" class="sidebar-search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
        <input id="noteSearch" type="search" autocomplete="off" placeholder="搜索标题或正文" aria-label="搜索标题或正文">
        <button id="closeSearchButton" class="search-close" type="button" aria-label="关闭搜索">×</button>
      </div>
      <div id="notesList" class="notes-list" aria-label="笔记列表"><div class="empty-state">正在加载笔记…</div></div>
    </aside>

    <section class="editor-panel" aria-label="笔记编辑区">
      <div class="editor-toolbar">
        <div class="breadcrumb"><span>笔记</span><span class="breadcrumb-slash">/</span><span id="noteMeta">新笔记</span></div>
        <div class="editor-actions">
          <span id="saveStatus" class="save-status" role="status" aria-live="polite">未保存</span>
          <button id="saveNoteButton" class="save-button" type="button">创建笔记</button>
          <div class="popover-anchor">
            <button id="noteMoreButton" class="icon-button note-more-button" type="button" aria-label="更多笔记操作" aria-expanded="false" aria-controls="noteMoreMenu" title="更多操作">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
            </button>
            <div id="noteMoreMenu" class="popover-menu note-more-menu" hidden>
              <button id="deleteNoteButton" class="menu-action danger-button" type="button" disabled>删除这篇笔记</button>
            </div>
          </div>
        </div>
      </div>
      <div class="editor-scroll">
        <div class="editor-body">
          <label class="visually-hidden" for="noteTitle">笔记标题</label>
          <input id="noteTitle" class="title-input" maxlength="200" placeholder="无标题笔记" autocomplete="off">
          <div class="editor-date" id="noteDate">开始记录你的想法</div>
          <div class="editor-divider"></div>
          <label class="visually-hidden" for="noteContent">笔记正文</label>
          <textarea id="noteContent" class="note-content" maxlength="100000" spellcheck="false" placeholder="开始写点什么…"></textarea>
        </div>
      </div>
      <div class="editor-footer"><span id="charCount">0 字符</span></div>
    </section>
  </main>

  <div id="chatBackdrop" class="chat-backdrop" hidden></div>
  <aside id="chatPanel" class="chat-panel" aria-label="AI 助手" aria-hidden="true">
    <div class="chat-header">
      <div><div class="chat-eyebrow">JOTANG AI</div><h2>AI 助手</h2></div>
      <div class="chat-header-actions">
        <button id="newChatButton" class="text-button" type="button">新会话</button>
        <button id="closeChatButton" class="icon-button" type="button" aria-label="关闭 AI 助手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
    </div>
    <div id="chatMessages" class="chat-messages" aria-live="polite">
      <div class="message assistant"><div class="message-role">Jotang AI</div><div class="message-body">你可以让我整理想法，或总结某篇笔记。</div></div>
    </div>
    <form id="chatForm" class="chat-form">
      <label class="visually-hidden" for="chatInput">发送消息给 AI</label>
      <textarea id="chatInput" rows="2" placeholder="输入问题… (Enter 发送)"></textarea>
      <button id="sendChatButton" class="button button-primary" type="submit">发送</button>
    </form>
  </aside>
</body>
</html>
