<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JotangNote</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast" class="toast"></div>

<div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
        <div class="brand brand-large">
            <div class="brand-mark">J</div>
            <div>
                <div class="brand-name">JotangNote</div>
                <div class="brand-subtitle">记录、整理，再交给 AI 理解</div>
            </div>
        </div>

        <div class="auth-tabs">
            <button id="loginTab" class="auth-tab active" type="button">登录</button>
            <button id="registerTab" class="auth-tab" type="button">注册</button>
        </div>

        <form id="authForm">
            <label>
                用户名
                <input id="usernameInput" autocomplete="username" required placeholder="输入用户名">
            </label>
            <label>
                密码
                <input id="passwordInput" type="password" autocomplete="current-password" required placeholder="输入密码">
            </label>
            <button id="authSubmit" class="primary full" type="submit">登录</button>
        </form>

        <p id="authHint" class="auth-hint">登录后可以创建笔记、编辑自己的笔记并使用 AI。</p>
    </div>
</div>

<header class="topbar">
    <div class="brand">
        <div class="brand-mark">J</div>
        <div>
            <div class="brand-name">JotangNote</div>
            <div class="brand-subtitle">Simple notes with an AI copilot</div>
        </div>
    </div>

    <div class="top-actions">
        <span id="userBadge" class="user-badge">未登录</span>
        <button id="logoutButton" class="ghost" type="button">退出</button>
    </div>
</header>

<main class="app-shell">
    <aside class="notes-panel panel">
        <div class="panel-header">
            <div>
                <div class="eyebrow">NOTES</div>
                <h2>笔记</h2>
            </div>
            <button id="newNoteButton" class="icon-button" type="button" title="新建笔记">＋</button>
        </div>

        <div class="search-row">
            <input id="noteSearch" placeholder="搜索标题或正文">
            <button id="refreshNotesButton" class="small-button" type="button">刷新</button>
        </div>

        <div id="notesList" class="notes-list">
            <div class="empty-state">正在加载笔记...</div>
        </div>
    </aside>

    <section class="editor-panel panel">
        <div class="editor-header">
            <div>
                <div id="noteMeta" class="eyebrow">NEW NOTE</div>
                <input id="noteTitle" class="title-input" placeholder="无标题笔记">
            </div>
            <div class="editor-actions">
                <button id="deleteNoteButton" class="danger ghost" type="button" disabled>删除</button>
                <button id="saveNoteButton" class="primary" type="button">保存</button>
            </div>
        </div>

        <textarea id="noteContent" class="note-content" placeholder="开始写点什么..."></textarea>

        <div class="editor-footer">
            <span id="saveStatus">未保存</span>
            <span id="charCount">0 字符</span>
        </div>
    </section>

    <aside class="chat-panel panel">
        <div class="panel-header chat-header">
            <div>
                <div class="eyebrow">AI COPILOT</div>
                <h2>Jotang AI</h2>
            </div>
            <button id="newChatButton" class="small-button" type="button">新会话</button>
        </div>

        <div id="chatMessages" class="chat-messages">
            <div class="message assistant">
                <div class="message-role">AI</div>
                <div class="message-body">可以直接和我聊天，也可以让我总结某个 ID 的笔记。</div>
            </div>
        </div>

        <form id="chatForm" class="chat-input-wrap">
            <textarea id="chatInput" rows="2" placeholder="例如：帮我总结 id=2 的笔记"></textarea>
            <button id="sendChatButton" class="primary" type="submit">发送</button>
        </form>
    </aside>
</main>

<script src="/app.js"></script>
</body>
</html>
