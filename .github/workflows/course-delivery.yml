name: Course delivery
on:
  push:
    branches: [course/delivery-20261116]
    paths: ["src/**", "pom.xml", "compose.yaml", "Dockerfile", "scripts/**", ".github/workflows/course-delivery.yml"]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DB_USERNAME: root
      DB_PASSWORD: testpass
      SPRING_RABBITMQ_USERNAME: jotang
      SPRING_RABBITMQ_PASSWORD: testpass
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: jotang_note
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -ptestpass" --health-interval=5s --health-timeout=5s --health-retries=40
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: jotang
          RABBITMQ_DEFAULT_PASS: testpass
        ports: ['5672:5672']
        options: --health-cmd="rabbitmq-diagnostics -q ping" --health-interval=10s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install test clients
        run: sudo apt-get update -qq && sudo apt-get install -y default-mysql-client redis-tools jq
      - name: Initialize schema and test
        run: |
          mysql -h127.0.0.1 -uroot -ptestpass < sql/schema.sql
          bash mvnw -B verify | tee /tmp/jotang-maven.log
      - name: Start application
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          java -jar target/JotangNote-0.0.1-SNAPSHOT.jar > /tmp/jotang-server.log 2>&1 &
          for i in {1..90}; do
            curl -fsS http://localhost:8080/hello && exit 0
            sleep 1
          done
          tail -100 /tmp/jotang-server.log
          exit 1
      - name: Real integration checks
        run: bash scripts/smoke-test.sh | tee /tmp/jotang-smoke.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser setup and verification
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
          node scripts/browser-evidence.cjs
      - name: Check real AI availability and error handling
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node scripts/ai-status-check.cjs | tee /tmp/jotang-ai.log
          if node -e "if(!require('/tmp/jotang-ai-status.json').available)process.exit(1)"; then
            node scripts/ai-live-test.cjs 2>&1 | tee -a /tmp/jotang-ai.log
          fi
      - name: Retain current test evidence
        if: success()
        run: |
          mkdir -p course/evidence
          cp /tmp/jotang-smoke.log /tmp/jotang-ai.log /tmp/jotang-ai-status.json course/evidence/
          python3 - <<'PYCODE'
          import pathlib,json,xml.etree.ElementTree as E,os
          totals={k:0 for k in ['tests','failures','errors','skipped']}
          for p in pathlib.Path('target/surefire-reports').glob('TEST-*.xml'):
              r=E.parse(p).getroot()
              for k in totals: totals[k]+=int(r.get(k,'0'))
          ai=json.loads(pathlib.Path('/tmp/jotang-ai-status.json').read_text())
          data={'run_id':int(os.environ['GITHUB_RUN_ID']),'commit':os.environ['GITHUB_SHA'],'tests':totals,'ai_live':ai['available'],'ai':ai}
          pathlib.Path('course/evidence/current.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          log=pathlib.Path('/tmp/jotang-server.log').read_text()
          pathlib.Path('course/evidence/mq.log').write_text('\n'.join(x for x in log.splitlines() if 'MQ received:' in x or 'MQ created note id=' in x or 'AI requested tool:' in x))
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/evidence Notes/screenshots Notes/AI-在线测试报告.md
          git diff --cached --quiet || git commit -m 'docs: record current course verification [skip ci]'
          git pull --rebase
          git push
      - name: Diagnose server failure
        if: failure()
        run: tail -n 100 /tmp/jotang-server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-verification
          path: |
            /tmp/jotang-*.log
            /tmp/jotang-ai-status.json
            target/surefire-reports/
            Notes/screenshots/
            Notes/AI-在线测试报告.md
          retention-days: 90

# Reverify online AI after the repository credential was updated.
