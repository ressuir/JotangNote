name: Verify actual release download
on:
  push:
    branches: [course/release-review-20261116]
permissions:
  contents: read
  actions: read
jobs:
  verify-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for corrected recording and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..100}; do
            status=$(gh run view 43865976701 --json status,conclusion --jq '.status+":"+(.conclusion//"")')
            if [ "$status" = completed:success ]; then break; fi
            if [[ "$status" == completed:* ]]; then echo "$status"; exit 1; fi
            sleep 10
          done
          [ "$status" = completed:success ]
          mkdir -p download
          gh release download course-20261116 --pattern 'JotangNote-course-delivery.zip' --dir download
      - name: Install video and PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg poppler-utils
      - name: Verify checksums, all deliverables, Git restoration, subtitles and video
        run: python3 course/verify-download.py | tee download/download-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: final-release-download-validation
          path: download/download-validation.json
          retention-days: 90
