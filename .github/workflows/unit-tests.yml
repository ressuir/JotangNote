name: Verify and document JotangNote

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run isolated authorization and AI tool tests
        run: bash ./mvnw -B '-Dtest=NoteAccessServiceTest,ChatServiceTest' test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: jotang_note
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: jotang
          RABBITMQ_DEFAULT_PASS: testpass
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DB_USERNAME: root
      DB_PASSWORD: testpass
      SPRING_RABBITMQ_USERNAME: jotang
      SPRING_RABBITMQ_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Initialize MySQL schema
        run: |
          if ! command -v mysql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y default-mysql-client redis-tools
          fi
          if ! command -v redis-cli >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y redis-tools
          fi
          mysql -h 127.0.0.1 -u root -ptestpass < sql/schema.sql
      - name: Run Maven tests
        run: bash ./mvnw -B test
      - name: Start server
        run: |
          bash ./mvnw -B -DskipTests spring-boot:run > /tmp/jotang-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/hello >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://localhost:8080/hello >/dev/null; then
            cat /tmp/jotang-server.log
            exit 1
          fi
      - name: Real HTTP smoke test with MySQL, Redis and RabbitMQ
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh | tee /tmp/jotang-smoke.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser integration test and genuine screenshots
        run: node scripts/browser-evidence.cjs
      - name: Upload test logs and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jotang-test-evidence
          path: |
            Notes/screenshots/*.png
            /tmp/jotang-smoke.log
            /tmp/jotang-server.log
          if-no-files-found: warn
          retention-days: 30
      - name: Publish screenshots into the submitted repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Notes/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture real browser and CI test screenshots"
            git push
          fi
      - name: Print server logs on failure
        if: failure()
        run: tail -n 160 /tmp/jotang-server.log 2>/dev/null || true
