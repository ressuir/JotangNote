name: Publish course evidence
on:
  push:
    branches: [course/delivery-20261116]
    paths: [.github/workflows/course-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: course/delivery-20261116
      - name: Wait for verified run and download its evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..80}; do
            state=$(gh run view 43862201520 --json status,conclusion --jq '.status+":"+(.conclusion//"")')
            if gh run view 43862201520 --json jobs --jq '.jobs[0].steps[] | select(.name == "Check real AI availability and error handling") | .conclusion' | grep -qx success; then break; fi
            if [[ "$state" == completed:* ]]; then break; fi
            sleep 10
          done
          [ "$state" = completed:success ]
          gh run download 43862201520 -n course-verification -D /tmp/evidence
      - name: Publish authentic screenshots and test summaries
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil, xml.etree.ElementTree as E
          base=pathlib.Path('/tmp/evidence')
          out=pathlib.Path('course/evidence'); out.mkdir(parents=True,exist_ok=True)
          reports=list(base.rglob('TEST-*.xml'))
          totals={k:0 for k in ['tests','failures','errors','skipped']}
          for p in reports:
              r=E.parse(p).getroot()
              for k in totals: totals[k]+=int(r.get(k,'0'))
          for p in base.rglob('*.png'):
              shutil.copy2(p,pathlib.Path('Notes/screenshots')/p.name)
          for name in ['jotang-smoke.log','jotang-ai.log']:
              p=next(base.rglob(name)); shutil.copy2(p,out/name)
          server=next(base.rglob('jotang-server.log')).read_text()
          print(chr(10).join(x for x in server.splitlines() if 'HttpClientErrorException' in x or 'Caused by:' in x or 'Authentication' in x))
          (out/'mq.log').write_text('\n'.join(x for x in server.splitlines() if 'MQ received:' in x or 'MQ created note id=' in x or 'AI requested tool:' in x))
          ai=(out/'jotang-ai.log').read_text()
          report=next(base.rglob('AI-在线测试报告.md')); shutil.copy2(report,pathlib.Path('Notes/AI-在线测试报告.md'))
          data={'run_id':43862201520,'commit':'538496c9cb2569f8e0cd557076a8f4320c657f96','tests':totals,'ai_live':'PASS: all live DeepSeek' in ai,'reports':[p.name for p in reports]}
          (out/'current.json').write_text(json.dumps(data,ensure_ascii=False,indent=2))
          print(json.dumps(data,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/evidence Notes/screenshots Notes/AI-在线测试报告.md
          git diff --cached --quiet || git commit -m 'docs: retain authentic course verification evidence [skip ci]'
          git push

# Evidence originates from the verified cloud run above.
