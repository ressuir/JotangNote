services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-course-root-change-me}
      MYSQL_DATABASE: jotang_note
      MYSQL_USER: ${DB_USERNAME:-jotang}
      MYSQL_PASSWORD: ${DB_PASSWORD:-course-db-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-jotang}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-course-mq-change-me}
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jotang_note?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DB_USERNAME:-jotang}
      DB_PASSWORD: ${DB_PASSWORD:-course-db-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-jotang}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-course-mq-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  mysql-data:
  redis-data:
  rabbit-data:
